name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Self-check only; it never calls the Claude API.
      - run: pip install claude-agent-sdk==0.2.179
      - run: python test_orchestrator.py
